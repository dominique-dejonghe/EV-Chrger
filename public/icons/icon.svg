<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#grad)"/>
  
  <!-- Lightning bolt icon -->
  <g transform="translate(256, 256)">
    <!-- Main bolt -->
    <path d="M -60 -120 L 20 -20 L -20 -20 L 60 120 L -20 20 L 20 20 Z" 
          fill="#ffffff" 
          stroke="#ffffff" 
          stroke-width="8" 
          stroke-linejoin="round"/>
    
    <!-- Charging plug base -->
    <circle cx="0" cy="140" r="30" fill="#ffffff" opacity="0.3"/>
    <rect x="-15" y="125" width="30" height="30" rx="5" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- Text "EV" at bottom -->
  <text x="256" y="450" 
        font-family="Arial, sans-serif" 
        font-size="72" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="#ffffff">
    EV
  </text>
</svg>
