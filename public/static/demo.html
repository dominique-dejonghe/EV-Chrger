<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charge Calculator - Interactive Demo Walkthrough</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .walkthrough-tooltip {
            animation: slideInRight 0.5s ease-out;
        }
        
        .highlight-box {
            animation: pulse 2s infinite;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.5);
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        
        .bounce-arrow {
            animation: bounce 1.5s infinite;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        .demo-iframe {
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        .step-indicator {
            transition: all 0.3s ease;
        }
        
        .step-indicator.active {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            transform: scale(1.1);
        }
        
        .tesla-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-blue-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-bolt text-3xl text-blue-600"></i>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">EV Charge Calculator</h1>
                        <p class="text-sm text-gray-600">Interactive Demo Walkthrough</p>
                    </div>
                </div>
                <a href="/app" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition-all flex items-center gap-2">
                    <i class="fas fa-calculator"></i>
                    Try it yourself
                </a>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Side - Demo App Preview -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-xl p-6">
                    <div class="mb-4 flex items-center justify-between">
                        <h2 class="text-xl font-bold text-gray-900">Live Demo</h2>
                        <div class="flex items-center gap-2 text-sm text-gray-600">
                            <span class="flex items-center gap-1">
                                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                                Live Preview
                            </span>
                        </div>
                    </div>
                    
                    <!-- Demo App IFrame -->
                    <div class="relative" id="demoContainer">
                        <iframe 
                            src="" 
                            class="demo-iframe w-full"
                            style="height: 700px;"
                            id="demoIframe"
                        ></iframe>
                        
                        <!-- Highlight Overlay -->
                        <div id="highlightOverlay" class="absolute pointer-events-none hidden">
                            <div class="highlight-box"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side - Walkthrough Steps -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-xl p-6 sticky top-8">
                    <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                        <i class="fas fa-route text-blue-600"></i>
                        Walkthrough Steps
                    </h2>
                    
                    <!-- Progress Bar -->
                    <div class="mb-6">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm font-medium text-gray-700">Progress</span>
                            <span class="text-sm font-medium text-blue-600" id="progressText">0%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div id="progressBar" class="tesla-gradient h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <!-- Steps List -->
                    <div class="space-y-3 mb-6" id="stepsList">
                        <!-- Steps will be dynamically generated -->
                    </div>
                    
                    <!-- Navigation Controls -->
                    <div class="flex gap-3">
                        <button 
                            id="prevBtn" 
                            class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                            disabled
                        >
                            <i class="fas fa-arrow-left mr-2"></i>Previous
                        </button>
                        <button 
                            id="nextBtn" 
                            class="flex-1 tesla-gradient hover:opacity-90 text-white font-semibold py-3 rounded-xl transition-all"
                        >
                            Next<i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                    
                    <button 
                        id="restartBtn" 
                        class="w-full mt-3 bg-blue-50 hover:bg-blue-100 text-blue-600 font-semibold py-3 rounded-xl transition-all hidden"
                    >
                        <i class="fas fa-redo mr-2"></i>Restart Tour
                    </button>
                </div>
            </div>
        </div>

        <!-- Tooltip Overlay - Semi-transparent, NO blur -->
        <div id="tooltipOverlay" class="fixed inset-0 bg-black/30 hidden z-50 fade-in">
            <div class="absolute" id="tooltipContainer">
                <div class="walkthrough-tooltip bg-white rounded-2xl shadow-2xl max-w-md p-6">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full tesla-gradient flex items-center justify-center text-white font-bold" id="tooltipStepNumber">
                                1
                            </div>
                            <h3 class="text-xl font-bold text-gray-900" id="tooltipTitle">Step Title</h3>
                        </div>
                    </div>
                    <p class="text-gray-700 mb-4 leading-relaxed" id="tooltipDescription">
                        Step description
                    </p>
                    <div class="flex items-center justify-between pt-4 border-t border-gray-200">
                        <button id="tooltipSkip" class="text-gray-600 hover:text-gray-800 font-medium">
                            Skip Tour
                        </button>
                        <button id="tooltipNext" class="tesla-gradient text-white px-6 py-2 rounded-lg font-semibold hover:opacity-90 transition-all">
                            Got it! <i class="fas fa-arrow-right ml-1"></i>
                        </button>
                    </div>
                </div>
                <div class="absolute bounce-arrow text-white text-4xl" id="tooltipArrow">
                    <i class="fas fa-arrow-down"></i>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Walkthrough Steps Configuration
        const walkthroughSteps = [
            {
                title: "Welcome to EV Charge Calculator",
                description: "Calculate charging speed, time, and costs for electric vehicles. This tool uses real charging curves and physics to give you accurate predictions.",
                icon: "fa-bolt",
                highlight: null,
                scrollTo: null,
                position: { top: "50%", left: "50%", transform: "translate(-50%, -50%)" }
            },
            {
                title: "Step 1: Choose Your Vehicle",
                description: "Search from 138+ electric vehicles. Each vehicle has real-world battery capacity, consumption, and charging curve data.",
                icon: "fa-car",
                highlight: "#vehicleSearch",
                scrollTo: "#vehicleSearch",
                scrollOffset: -200,
                position: { top: "20%", left: "50%" }
            },
            {
                title: "Step 2: Battery Charge Range",
                description: "Set your starting and target battery percentage. Notice: 20-80% charges MUCH faster than 80-100% due to the charging curve!",
                icon: "fa-battery-three-quarters",
                highlight: "#startSocRange",
                scrollTo: "#startSocRange",
                scrollOffset: -150,
                position: { top: "35%", left: "50%" }
            },
            {
                title: "Charging Curve Physics",
                description: "Example: 20-30% charges at 150kW (3 min), but 80-100% only gets 46kW (19 min). That's real battery protection at work!",
                icon: "fa-chart-line",
                highlight: null,
                scrollTo: "#startSocRange",
                scrollOffset: -150,
                position: { top: "40%", left: "50%" }
            },
            {
                title: "Step 3: Charging Power",
                description: "Set the charger power (1-350 kW). The app automatically limits to your vehicle's max DC charging capability.",
                icon: "fa-charging-station",
                highlight: "#chargerPowerRange",
                scrollTo: "#chargerPowerRange",
                scrollOffset: -150,
                position: { top: "50%", left: "50%" }
            },
            {
                title: "Step 4: Charging Time (Optional)",
                description: "How much time do you have? This helps calculate how much range you'll add during your stop.",
                icon: "fa-clock",
                highlight: "#chargingTimeRange",
                scrollTo: "#chargingTimeRange",
                scrollOffset: -150,
                position: { top: "58%", left: "50%" }
            },
            {
                title: "Step 5: Electricity Price",
                description: "Set your electricity cost per kWh. Default is €0.30, but adjust for home charging (€0.10) or fast charging (€0.70).",
                icon: "fa-euro-sign",
                highlight: "#electricityPriceRange",
                scrollTo: "#electricityPriceRange",
                scrollOffset: -150,
                position: { top: "68%", left: "50%" }
            },
            {
                title: "Calculate!",
                description: "Click to see: charging speed (km/h), effective power (kW), total time, range added, and total cost. All based on real physics!",
                icon: "fa-calculator",
                highlight: "#calculateBtn",
                scrollTo: "#calculateBtn",
                scrollOffset: -200,
                position: { top: "75%", left: "50%" }
            },
            {
                title: "Results & Insights",
                description: "Get detailed breakdown: charging time, km/h, cost per 100km, and energy used. Premium users see the full charging curve graph!",
                icon: "fa-chart-bar",
                highlight: "#resultsSection",
                scrollTo: "#resultsSection",
                scrollOffset: 0,
                position: { top: "80%", left: "50%" }
            },
            {
                title: "My Vehicles (Premium)",
                description: "Save your favorite vehicles for quick access. Premium users can save unlimited vehicles and get instant calculations!",
                icon: "fa-star",
                highlight: "#quickSelectContainer",
                scrollTo: "#quickSelectContainer",
                scrollOffset: -80,
                position: { top: "25%", left: "50%" }
            },
            {
                title: "Ready to Start?",
                description: "You're all set! Try the calculator with your own vehicle and see how different charging strategies affect time and cost.",
                icon: "fa-rocket",
                highlight: null,
                scrollTo: null,
                position: { top: "50%", left: "50%", transform: "translate(-50%, -50%)" }
            }
        ];

        let currentStep = 0;

        // Initialize
        function init() {
            renderSteps();
            updateProgress();
            updateButtons();
            showTooltip();
        }

        // Render steps list
        function renderSteps() {
            const stepsList = document.getElementById('stepsList');
            stepsList.innerHTML = walkthroughSteps.map((step, index) => `
                <div class="step-indicator flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all hover:bg-gray-50 ${index === currentStep ? 'active' : 'bg-white'}" data-step="${index}">
                    <div class="w-8 h-8 rounded-full ${index === currentStep ? 'bg-white text-blue-600' : 'bg-gray-100 text-gray-600'} flex items-center justify-center font-bold text-sm">
                        ${index + 1}
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-semibold ${index === currentStep ? 'text-white' : 'text-gray-900'}">${step.title}</p>
                    </div>
                    <i class="fas ${step.icon} ${index === currentStep ? 'text-white' : 'text-gray-400'}"></i>
                </div>
            `).join('');

            // Add click handlers
            document.querySelectorAll('.step-indicator').forEach(el => {
                el.addEventListener('click', () => {
                    goToStep(parseInt(el.dataset.step));
                });
            });
        }

        // Update progress bar
        function updateProgress() {
            const progress = ((currentStep + 1) / walkthroughSteps.length) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${Math.round(progress)}%`;
        }

        // Update navigation buttons
        function updateButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const restartBtn = document.getElementById('restartBtn');

            prevBtn.disabled = currentStep === 0;
            
            if (currentStep === walkthroughSteps.length - 1) {
                nextBtn.classList.add('hidden');
                restartBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                restartBtn.classList.add('hidden');
            }
        }

        // Show tooltip
        function showTooltip() {
            const overlay = document.getElementById('tooltipOverlay');
            const container = document.getElementById('tooltipContainer');
            const step = walkthroughSteps[currentStep];

            // Update tooltip content
            document.getElementById('tooltipStepNumber').textContent = currentStep + 1;
            document.getElementById('tooltipTitle').textContent = step.title;
            document.getElementById('tooltipDescription').textContent = step.description;

            // Position tooltip
            Object.assign(container.style, {
                top: step.position.top,
                left: step.position.left,
                transform: step.position.transform || 'translate(-50%, -50%)'
            });

            // Show overlay
            overlay.classList.remove('hidden');

            // Scroll iframe to relevant element
            if (step.highlight) {
                scrollIframeToElement(step.highlight);
            }

            renderSteps();
        }

        // Scroll iframe to show the highlighted element
        function scrollIframeToElement(selector) {
            try {
                const iframe = document.getElementById('demoIframe');
                const iframeWindow = iframe.contentWindow;
                const step = walkthroughSteps[currentStep];
                
                // Check if iframe is loaded
                if (!iframeLoaded) {
                    console.warn('Iframe not loaded yet, waiting...');
                    setTimeout(() => scrollIframeToElement(selector), 500);
                    return;
                }
                
                // Send message to iframe to scroll to element with offset
                iframeWindow.postMessage({
                    type: 'scrollToElement',
                    selector: step.scrollTo || selector,
                    offset: step.scrollOffset || 0
                }, '*');
                
                console.log('Scrolling iframe to:', step.scrollTo || selector, 'offset:', step.scrollOffset);
            } catch (e) {
                console.error('Failed to scroll iframe:', e);
            }
        }

        // Navigate to step
        function goToStep(step) {
            if (step >= 0 && step < walkthroughSteps.length) {
                currentStep = step;
                updateProgress();
                updateButtons();
                showTooltip();
            }
        }

        // Next step
        function nextStep() {
            goToStep(currentStep + 1);
        }

        // Previous step
        function prevStep() {
            goToStep(currentStep - 1);
        }

        // Restart tour
        function restart() {
            goToStep(0);
        }

        // Skip tour
        function skipTour() {
            document.getElementById('tooltipOverlay').classList.add('hidden');
        }

        // Event Listeners
        document.getElementById('nextBtn').addEventListener('click', nextStep);
        document.getElementById('prevBtn').addEventListener('click', prevStep);
        document.getElementById('restartBtn').addEventListener('click', restart);
        document.getElementById('tooltipNext').addEventListener('click', nextStep);
        document.getElementById('tooltipSkip').addEventListener('click', skipTour);

        // Close on ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                skipTour();
            } else if (e.key === 'ArrowRight') {
                nextStep();
            } else if (e.key === 'ArrowLeft') {
                prevStep();
            }
        });

        // Wait for iframe to load before initializing
        const iframe = document.getElementById('demoIframe');
        let iframeLoaded = false;
        
        // Set iframe src dynamically to use current origin
        iframe.src = window.location.origin + '/app';
        
        iframe.addEventListener('load', () => {
            console.log('Iframe loaded successfully from:', iframe.src);
            iframeLoaded = true;
        });
        
        // Initialize on load
        init();
    </script>
</body>
</html>
